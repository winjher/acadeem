<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academic System</title>
  <style>
  :root {
    --primary: #1e3a5f;
    --accent: #2f6fed;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #e1e5eb;
    --text: #1f2937;
    --muted: #6b7280;
    --danger: #d64545;
    --success: #1c8a4b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
  }
  #login-view {
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-box {
    background: var(--card); padding: 32px; border-radius: 12px; width: 320px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
  }
  .login-box h1 { font-size: 20px; margin: 0 0 4px; color: var(--primary); }
  .login-box p.sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .portal-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
  .portal-btn {
    background: #eef1f6; color: var(--primary); border: 1px solid var(--border);
    padding: 16px 8px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    text-align: center; line-height: 1.3;
  }
  .portal-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  input, select, textarea {
    width: 100%; padding: 9px 10px; margin-bottom: 12px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 14px;
  }
  button {
    background: var(--accent); color: #fff; border: none; padding: 9px 16px;
    border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  button.secondary { background: #eef1f6; color: var(--text); }
  button.danger { background: var(--danger); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: var(--danger); font-size: 13px; margin: -4px 0 12px; }
  .success-msg { color: var(--success); font-size: 13px; margin: -4px 0 12px; }

  #app-view { display: none; }
  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 210px; background: var(--primary); color: #fff; padding: 18px 0; flex-shrink: 0;
  }
  .sidebar h2 { font-size: 15px; padding: 0 18px; margin: 0 0 18px; }
  .sidebar .who { padding: 0 18px 16px; font-size: 12px; opacity: 0.75; border-bottom: 1px solid rgba(255,255,255,0.15); margin-bottom: 10px; }
  .nav-item {
    padding: 10px 18px; cursor: pointer; font-size: 14px; opacity: 0.85;
  }
  .nav-item:hover { background: rgba(255,255,255,0.08); }
  .nav-item.active { background: rgba(255,255,255,0.15); opacity: 1; font-weight: 600; }
  .main { flex: 1; padding: 24px 28px; overflow-x: auto; }
  .main h1 { font-size: 20px; margin: 0 0 18px; color: var(--primary); }
  .card { background: var(--card); border-radius: 10px; padding: 18px; margin-bottom: 18px; border: 1px solid var(--border); }
  .card h3 { margin: 0 0 12px; font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  .row-actions button { font-size: 12px; padding: 5px 10px; margin-right: 6px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.active, .badge.open, .badge.passed, .badge.paid, .badge.enrolled { background: #e3f5ea; color: var(--success); }
  .badge.dissolved, .badge.cancelled, .badge.failed, .badge.inactive { background: #fbe6e6; color: var(--danger); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .muted { color: var(--muted); font-size: 12px; }
  #toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: #fff;
    padding: 10px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 99;
  }
</style>

</head>
<body>

  <div id="login-view">
    <div class="login-box">
      <h1 id="school-name">Academic System</h1>
      <p class="sub" id="portal-sub">Choose a portal to sign in</p>

      <div id="portal-picker" class="portal-picker">
        <button type="button" class="portal-btn" data-portal="faculty" onclick="selectPortal('faculty')">Faculty Portal</button>
        <button type="button" class="portal-btn" data-portal="student" onclick="selectPortal('student')">Student Portal</button>
        <button type="button" class="portal-btn" data-portal="employee" onclick="selectPortal('employee')">Employee Portal</button>
        <button type="button" class="portal-btn" data-portal="dean" onclick="selectPortal('dean')">Dean's Module</button>
      </div>

      <div id="portal-form" style="display:none;">
        <p class="muted" id="portal-active-label" style="margin:0 0 12px;"></p>
        <div id="login-error" class="error" style="display:none;"></div>
        <input id="login-username" placeholder="Username" autocomplete="username">
        <input id="login-password" type="password" placeholder="Password" autocomplete="current-password">
        <button id="login-btn" style="width:100%;">Log In</button>
        <button type="button" class="secondary" style="width:100%;margin-top:8px;" onclick="backToPortals()">&larr; Switch Portal</button>
      </div>
      <p class="muted" style="margin-top:14px;">Default admin: admin / admin123 (Employee Portal)</p>
    </div>
  </div>

  <div id="app-view">
    <div class="app-shell">
      <div class="sidebar">
        <h2 id="sidebar-school">Academic System</h2>
        <div class="who" id="who-box"></div>
        <div id="nav-items"></div>
        <div class="nav-item" onclick="doLogout()">Log Out</div>
      </div>
      <div class="main">
        <div id="content"></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
  var authToken = null;
  var currentUser = null;
  var settingsCache = null;

  // Surface ANY uncaught JS error on-screen (instead of a silent blank
  // page) — this is a temporary but permanent-until-removed diagnostic.
  window.onerror = function (msg, src, line, col, err) {
    var box = document.getElementById('js-error-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'js-error-box';
      box.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#b30000;color:#fff;' +
        'font-family:monospace;font-size:12px;padding:10px;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto;';
      document.body.appendChild(box);
    }
    box.textContent = 'JS ERROR: ' + msg + '\n  at line ' + line + ':' + col + (err && err.stack ? '\n' + err.stack : '');
    return false;
  };

  // ---------- utilities ----------
  function toast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = isError ? '#d64545' : '#1e3a5f';
    t.style.display = 'block';
    setTimeout(function () { t.style.display = 'none'; }, 3200);
  }
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbz9f6VBTt3VmQj-xiby5M8o7uZgXUzkI81RvfgvsTLxqnwFh94Qc4GPNj4zI8ih2fCA/exec';

  function call(fnName, args, onSuccess, onError) {
    function fail(err) {
      toast(err.message || String(err), true);
      if (onError) onError(err);
    }
    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'rpc', fn: fnName, args: args || [] })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) { fail(new Error(res.message || 'Request failed.')); return; }
        try {
          onSuccess(res.result);
        } catch (e) {
          console.error(e);
          toast('Page error: ' + e.message, true);
        }
      })
      .catch(function (e) { fail(new Error('Could not reach the server. Check the ENDPOINT URL and your connection. (' + e.message + ')')); });
  }
  function esc(s) {
    return (s === undefined || s === null) ? '' : String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function badge(status) {
    var cls = String(status || '').toLowerCase();
    return '<span class="badge ' + cls + '">' + esc(status) + '</span>';
  }

  // ---------- College / Department cascading dropdowns ----------
  // Used anywhere a College or Department needs to be picked from a list
  // (Add Subject, Add Faculty, Add Student, Chairman loading) instead of
  // typed freehand, so the values line up cleanly across the system.
  function loadCollegeSelect_(selId, onChangeFn) {
    call('listColleges', [authToken], function (list) {
      var el = document.getElementById(selId);
      if (!el) return;
      el.innerHTML = '<option value="">Select College…</option>' +
        list.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
      el.onchange = onChangeFn || null;
    });
  }
  function loadDeptSelect_(selId, college) {
    call('listDepartments', [authToken, college], function (list) {
      var el = document.getElementById(selId);
      if (!el) return;
      el.innerHTML = '<option value="">Select Department…</option>' +
        list.map(function (d) { return '<option value="' + esc(d) + '">' + esc(d) + '</option>'; }).join('');
    });
  }

  // ---------- login / portal switcher ----------
  // Which roles are allowed to sign in through each portal. This is a
  // UI-level convenience (clearer forms, fewer support questions about
  // "which login do I use") — the server still enforces every actual
  // permission on its own regardless of which portal was used.
  var PORTALS = {
    faculty: { label: 'Faculty Portal', roles: ['Faculty', 'Chairman'] },
    student: { label: 'Student Portal', roles: ['Student'] },
    employee: { label: 'Employee Portal', roles: ['Admin', 'OCDI', 'Admission', 'Accounting', 'Registrar'] },
    dean: { label: "Dean's Module", roles: ['Dean'] }
  };
  var selectedPortal = null;

  function selectPortal(key) {
    selectedPortal = key;
    document.getElementById('portal-picker').style.display = 'none';
    document.getElementById('portal-form').style.display = 'block';
    document.getElementById('portal-sub').textContent = PORTALS[key].label;
    document.getElementById('portal-active-label').textContent = 'Signing in to the ' + PORTALS[key].label;
    document.getElementById('login-error').style.display = 'none';
    document.getElementById('login-username').value = '';
    document.getElementById('login-password').value = '';
    document.getElementById('login-username').focus();
  }
  function backToPortals() {
    selectedPortal = null;
    document.getElementById('portal-form').style.display = 'none';
    document.getElementById('portal-picker').style.display = 'grid';
    document.getElementById('portal-sub').textContent = 'Choose a portal to sign in';
  }

  document.getElementById('login-btn').onclick = doLogin;
  document.getElementById('login-password').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin();
  });

  function doLogin() {
    var u = document.getElementById('login-username').value.trim();
    var p = document.getElementById('login-password').value;
    document.getElementById('login-error').style.display = 'none';
    if (!selectedPortal || !u || !p) return;
    call('login', [u, p], function (res) {
      var allowedRoles = PORTALS[selectedPortal].roles;
      if (allowedRoles.indexOf(res.role) === -1) {
        call('logout', [res.token], function () {});
        document.getElementById('login-error').textContent =
          'This account (' + res.role + ') isn\'t used with the ' + PORTALS[selectedPortal].label + '. Switch portals and try again.';
        document.getElementById('login-error').style.display = 'block';
        return;
      }
      authToken = res.token;
      currentUser = res;
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'block';
      document.getElementById('who-box').innerHTML = esc(res.name) + '<br><span style="opacity:.7">' + esc(res.role) + '</span>';
      // Load settings FIRST, then build the nav — the first page rendered
      // (the dashboard) reads settingsCache, so it must exist by then.
      call('getSettings', [authToken], function (s) {
        settingsCache = s || {};
        document.getElementById('school-name').textContent = settingsCache.SchoolName || 'Academic System';
        document.getElementById('sidebar-school').textContent = settingsCache.SchoolName || 'Academic System';
        buildNav();
      }, function () {
        settingsCache = {};
        buildNav();
      });
    }, function (err) {
      document.getElementById('login-error').textContent = err.message || 'Login failed.';
      document.getElementById('login-error').style.display = 'block';
    });
  }

  function doLogout() {
    call('logout', [authToken], function () {
      authToken = null; currentUser = null;
      document.getElementById('app-view').style.display = 'none';
      document.getElementById('login-view').style.display = 'flex';
      document.getElementById('login-username').value = '';
      document.getElementById('login-password').value = '';
      backToPortals();
    });
  }

  // ---------- nav ----------
  var NAV = {
    Admin: [
      ['dashboard', 'Dashboard'], ['students', 'Students'], ['faculty', 'Faculty'],
      ['subjects', 'Subjects'], ['colleges', 'Colleges & Departments'], ['sections', 'Sections & Loading'],
      ['enrollment', 'Enrollment'], ['grades', 'Grades'], ['payments', 'Payments'],
      ['settings', 'Settings'], ['users', 'User Accounts']
    ],
    Chairman: [ ['chairman', 'Faculty Loading (My Department)'] ],
    OCDI: [ ['curriculum', 'Curriculum Management'] ],
    Admission: [ ['admissions', 'Applicants'] ],
    Dean: [ ['dean', 'Dean Dashboard'] ],
    Accounting: [ ['accounting', 'Payments & Tuition'] ],
    Registrar: [ ['registrar', 'ToR / Diploma Requests'] ],
    Faculty: [ ['myload', 'My Teaching Load'], ['encode', 'Encode Grades'] ],
    Student: [ ['enroll', 'Enroll in Subjects'], ['myenrollment', 'My Subjects'], ['mygrades', 'My Grades'], ['mypayments', 'My Payments'], ['documents', 'Request ToR / Diploma'] ]
  };

  function buildNav() {
    var items = NAV[currentUser.role] || [];
    var html = items.map(function (it) {
      return '<div class="nav-item" data-view="' + it[0] + '" onclick="goTo(\'' + it[0] + '\')">' + it[1] + '</div>';
    }).join('');
    document.getElementById('nav-items').innerHTML = html;
    goTo(items.length ? items[0][0] : '');
  }

  function goTo(view) {
    document.querySelectorAll('.nav-item[data-view]').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-view') === view);
    });
    var renderers = {
      dashboard: renderAdminDashboard, students: renderStudents, faculty: renderFaculty,
      subjects: renderSubjects, colleges: renderColleges, sections: renderSections, enrollment: renderEnrollmentAdmin,
      grades: renderGradesAdmin, payments: renderPayments, settings: renderSettings, users: renderUsers,
      chairman: renderChairmanLoad, curriculum: renderCurriculum, admissions: renderAdmissions,
      dean: renderDeanDashboard, accounting: renderAccounting, registrar: renderRegistrar,
      myload: renderMyLoad, encode: renderEncode,
      enroll: renderEnrollSubjects, myenrollment: renderMyEnrollment, mygrades: renderMyGrades, mypayments: renderMyPayments,
      documents: renderStudentDocuments
    };
    if (renderers[view]) renderers[view]();
  }

  // ============ ADMIN: Dashboard ============
  function renderAdminDashboard() {
    document.getElementById('content').innerHTML =
      '<h1>Dashboard</h1><div class="card"><p class="muted">Current term: <b>' +
      esc((settingsCache || {}).CurrentSchoolYear) + ' — ' + esc((settingsCache || {}).CurrentSemester) +
      '</b></p><p class="muted">Use the sidebar to manage students, faculty loading, subjects, enrollment, grades, and payments. ' +
      'Changing the term or grading settings under <b>Settings</b> automatically applies to new enrollments and every grade computed from then on.</p></div>';
  }

  // ============ ADMIN: Students ============
  function renderStudents() {
    var c = document.getElementById('content');
    c.innerHTML = '<h1>Students</h1>' +
      '<div class="card"><h3>Add Student</h3><div class="form-grid">' +
      '<input id="s-first" placeholder="First name">' +
      '<input id="s-last" placeholder="Last name">' +
      '<select id="s-college"></select>' +
      '<input id="s-course" placeholder="Course (e.g. BSIT)">' +
      '<input id="s-year" placeholder="Year Level (e.g. 1)">' +
      '<input id="s-email" placeholder="Email">' +
      '<input id="s-phone" placeholder="Phone"></div>' +
      '<button onclick="addStudentClick()">Add Student</button></div>' +
      '<div class="card"><h3>All Students</h3><div id="students-table">Loading…</div></div>';
    loadCollegeSelect_('s-college');
    loadStudents();
  }
  function addStudentClick() {
    var payload = {
      firstName: val('s-first'), lastName: val('s-last'), college: val('s-college'), course: val('s-course'),
      yearLevel: val('s-year'), email: val('s-email'), phone: val('s-phone')
    };
    if (!payload.firstName || !payload.lastName) { toast('First and last name required.', true); return; }
    call('addStudent', [authToken, payload], function (id) {
      toast('Student added: ' + id); renderStudents();
    });
  }
  function loadStudents() {
    call('listStudents', [authToken], function (rows) {
      var html = '<table><tr><th>ID</th><th>Name</th><th>Course</th><th>Year</th><th>Status</th><th></th></tr>';
      rows.forEach(function (r) {
        html += '<tr><td>' + esc(r.StudentID) + '</td><td>' + esc(r.FirstName) + ' ' + esc(r.LastName) +
          '</td><td>' + esc(r.Course) + '</td><td>' + esc(r.YearLevel) + '</td><td>' + badge(r.Status) +
          '</td><td class="row-actions">' +
          (r.Status === 'Active' ? '<button class="secondary" onclick="archiveStudentClick(\'' + r.StudentID + '\')">Archive</button>' : '') +
          '</td></tr>';
      });
      html += '</table>';
      document.getElementById('students-table').innerHTML = html || '<p class="muted">No students yet.</p>';
    });
  }
  function archiveStudentClick(id) {
    call('archiveStudent', [authToken, id], function () { toast('Archived.'); loadStudents(); });
  }

  // ============ ADMIN: Faculty ============
  function renderFaculty() {
    var c = document.getElementById('content');
    c.innerHTML = '<h1>Faculty</h1>' +
      '<div class="card"><h3>Add Faculty</h3><div class="form-grid">' +
      '<input id="f-first" placeholder="First name">' +
      '<input id="f-last" placeholder="Last name">' +
      '<select id="f-college"></select>' +
      '<select id="f-dept"></select>' +
      '<input id="f-maxload" placeholder="Max Load Units (e.g. 24)">' +
      '<input id="f-email" placeholder="Email"></div>' +
      '<button onclick="addFacultyClick()">Add Faculty</button></div>' +
      '<div class="card"><h3>All Faculty</h3><div id="faculty-table">Loading…</div></div>';
    loadCollegeSelect_('f-college', function () { loadDeptSelect_('f-dept', val('f-college')); });
    loadDeptSelect_('f-dept', '');
    loadFaculty();
  }
  function addFacultyClick() {
    var payload = {
      firstName: val('f-first'), lastName: val('f-last'), college: val('f-college'), department: val('f-dept'),
      maxLoadUnits: Number(val('f-maxload')) || 24, email: val('f-email')
    };
    if (!payload.firstName || !payload.lastName) { toast('First and last name required.', true); return; }
    call('addFaculty', [authToken, payload], function (id) { toast('Faculty added: ' + id); renderFaculty(); });
  }
  function loadFaculty() {
    call('listFaculty', [authToken], function (rows) {
      var html = '<table><tr><th>ID</th><th>Name</th><th>Department</th><th>Max Load</th><th>Status</th></tr>';
      rows.forEach(function (r) {
        html += '<tr><td>' + esc(r.FacultyID) + '</td><td>' + esc(r.FirstName) + ' ' + esc(r.LastName) +
          '</td><td>' + esc(r.Department) + '</td><td>' + esc(r.MaxLoadUnits) + '</td><td>' + badge(r.Status) + '</td></tr>';
      });
      html += '</table>';
      document.getElementById('faculty-table').innerHTML = html;
    });
  }

  // ============ ADMIN: Subjects ============
  function renderSubjects() {
    var c = document.getElementById('content');
    c.innerHTML = '<h1>Subjects</h1>' +
      '<div class="card"><h3>Add Subject</h3><div class="form-grid">' +
      '<input id="sub-code" placeholder="Subject Code (e.g. IT101)">' +
      '<input id="sub-name" placeholder="Subject Name">' +
      '<input id="sub-units" placeholder="Units (e.g. 3)">' +
      '<select id="sub-college"></select>' +
      '<select id="sub-dept"></select>' +
      '<input id="sub-prereq" placeholder="Prerequisite (optional)"></div>' +
      '<button onclick="addSubjectClick()">Add Subject</button></div>' +
      '<div class="card"><h3>All Subjects</h3><div id="subjects-table">Loading…</div></div>';
    loadCollegeSelect_('sub-college', function () { loadDeptSelect_('sub-dept', val('sub-college')); });
    loadDeptSelect_('sub-dept', '');
    loadSubjects();
  }
  function addSubjectClick() {
    var payload = {
      subjectCode: val('sub-code'), subjectName: val('sub-name'), units: Number(val('sub-units')) || 0,
      college: val('sub-college'), department: val('sub-dept'), prerequisite: val('sub-prereq')
    };
    if (!payload.subjectCode || !payload.subjectName) { toast('Code and name required.', true); return; }
    call('addSubject', [authToken, payload], function () { toast('Subject added.'); renderSubjects(); });
  }
  function loadSubjects() {
    call('listSubjects', [authToken], function (rows) {
      var html = '<table><tr><th>Code</th><th>Name</th><th>Units</th><th>Status</th><th></th></tr>';
      rows.forEach(function (r) {
        html += '<tr><td>' + esc(r.SubjectCode) + '</td><td>' + esc(r.SubjectName) + '</td><td>' + esc(r.Units) +
          '</td><td>' + badge(r.Status) + '</td><td class="row-actions">';
        if (r.Status === 'Active') {
          html += '<button class="danger" onclick="dissolveClick(\'' + r.SubjectCode + '\')">Dissolve</button>';
        } else {
          html += '<button class="secondary" onclick="reactivateClick(\'' + r.SubjectCode + '\')">Reactivate</button>';
        }
        html += '</td></tr>';
      });
      html += '</table>';
      document.getElementById('subjects-table').innerHTML = html;
    });
  }
  function dissolveClick(code) {
    var reason = prompt('Reason for dissolving ' + code + '?') || '';
    call('dissolveSubject', [authToken, code, reason], function (res) {
      toast('Dissolved. Sections cancelled: ' + res.sectionsCancelled);
      renderSubjects();
    });
  }
  function reactivateClick(code) {
    call('reactivateSubject', [authToken, code], function () { toast('Reactivated.'); renderSubjects(); });
  }

  // ============ ADMIN: Colleges & Departments ============
  function renderColleges() {
    var c = document.getElementById('content');
    c.innerHTML = '<h1>Colleges & Departments</h1>' +
      '<p class="muted">This list feeds every College/Department dropdown in the system (Subjects, Faculty, Students, and the Chairman page).</p>' +
      '<div class="card"><h3>Add College / Department</h3><div class="form-grid">' +
      '<input id="cd-college" placeholder="College (e.g. College of Engineering)">' +
      '<input id="cd-dept" placeholder="Department (e.g. Computer Science)"></div>' +
      '<button onclick="addCollegeDeptClick()">Add</button></div>' +

  function loadPaymentAudit_() {
    call('listAllPayments', [authToken], function (rows) {
      var html = '<table><tr><th>ID</th><th>Student</th><th>Amount</th><th>Category</th><th>Method</th><th>Recorded By</th><th>Date</th></tr>';
      rows.forEach(function (r) {
        html += '<tr><td>' + esc(r.PaymentID) + '</td><td>' + esc(r.studentName) + '</td><td>' + esc(r.Amount) +
          '</td><td>' + esc(r.Category) + '</td><td>' + esc(r.Method) + '</td><td>' + esc(r.RecordedBy) +
          '</td><td>' + esc(r.DateCreated) + '</td></tr>';
      });
      html += '</table>';
      document.getElementById('acc-audit-table').innerHTML = html || '<p class="muted">No payments recorded yet.</p>';
    });
  }

  // ============ REGISTRAR ============
  function renderRegistrar() {
    var c = document.getElementById('content');
    c.innerHTML = '<h1>ToR / Diploma Requests</h1><div id="registrar-table">Loading…</div>';
    loadRegistrarQueue_();
  }
  function loadRegistrarQueue_() {
    call('listDocumentRequests', [authToken], function (rows) {
      var html = '<table><tr><th>Student</th><th>Course</th><th>Type</th><th>Status</th><th>Requested</th><th>Notes</th><th></th></tr>';
      rows.forEach(function (r) {
        html += '<tr><td>' + esc(r.studentName) + '</td><td>' + esc(r.course) + '</td><td>' + esc(r.Type) +
          '</td><td>' + badge(r.Status) + '</td><td>' + esc(r.DateRequested ? new Date(r.DateRequested).toLocaleDateString() : '') +
          '</td><td>' + esc(r.Notes) + '</td><td class="row-actions">';
        if (r.Status === 'Pending') {
          html += '<button onclick="setDocStatusClick(\'' + r.RequestID + '\',\'Processing\')">Start Processing</button> ' +
            '<button class="danger" onclick="setDocStatusClick(\'' + r.RequestID + '\',\'Rejected\')">Reject</button>';
        } else if (r.Status === 'Processing') {
          html += '<button onclick="setDocStatusClick(\'' + r.RequestID + '\',\'Released\')">Mark Released</button>';
        }
        html += '</td></tr>';
      });
      html += '</table>';
      document.getElementById('registrar-table').innerHTML = html || '<p class="muted">No requests yet.</p>';
    });
  }
  function setDocStatusClick(id, status) {
    call('updateDocumentRequestStatus', [authToken, id, status], function () {
      toast('Updated.'); loadRegistrarQueue_();
    });
  }

  // ============ FACULTY ============
  function renderMyLoad() {
    call('getFacultyLoad', [authToken, currentUser.linkedId], function (res) {
      var html = '<h1>My Teaching Load</h1><div class="card"><p class="muted">Total units this term: <b>' +
        esc(res.totalUnits) + '</b></p><table><tr><th>Section</th><th>Subject</th><th>Units</th><th>Schedule</th><th>Status</th></tr>';
      res.sections.forEach(function (s) {
        html += '<tr><td>' + esc(s.sectionId) + '</td><td>' + esc(s.subjectCode) + ' - ' + esc(s.subjectName) +
          '</td><td>' + esc(s.units) + '</td><td>' + esc(s.schedule) + '</td><td>' + badge(s.status) + '</td></tr>';
      });
      html += '</table></div>';
      document.getElementById('content').innerHTML = html;
    });
  }
  function renderEncode() {
    var c = document.getElementById('content');
    c.innerHTML = '<h1>Encode Grades</h1><div class="card"><h3>Select Section</h3><div class="form-grid">' +
      '<input id="enc-section" placeholder="Section ID"></div>' +
      '<button class="secondary" onclick="loadClassListClick()">Load Class List</button>' +
      '<div id="classlist-table" style="margin-top:14px;"></div></div>';
  }
  function loadClassListClick() {
    var sectionId = val('enc-section');
    call('getClassList', [authToken, sectionId], function (rows) {
      var html = '<table><tr><th>Student</th><th>Prelim</th><th>Midterm</th><th>Final</th><th>Final Grade</th><th>Remarks</th></tr>';
      rows.forEach(function (r) {
        html += '<tr><td>' + esc(r.name) + ' <span class="muted">(' + esc(r.studentId) + ')</span></td>' +
          '<td><input style="width:60px;margin:0;" id="p-' + r.studentId + '" value="' + esc(r.prelim) + '"></td>' +
          '<td><input style="width:60px;margin:0;" id="m-' + r.studentId + '" value="' + esc(r.midterm) + '"></td>' +
          '<td><input style="width:60px;margin:0;" id="f-' + r.studentId + '" value="' + esc(r.final) + '"></td>' +
          '<td>' + esc(r.finalGrade) + '</td><td>' + (r.remarks ? badge(r.remarks) : '') + '</td>' +
          '<td><button onclick="saveGradeClick(\'' + sectionId + '\',\'' + r.studentId + '\')">Save</button></td></tr>';
      });
      html += '</table>';
      document.getElementById('classlist-table').innerHTML = html || '<p class="muted">No students enrolled.</p>';
    });
  }
  function saveGradeClick(sectionId, studentId) {
    var p = val('p-' + studentId), m = val('m-' + studentId), f = val('f-' + studentId);
    var calls = 0, total = 0;
    [['Prelim', p], ['Midterm', m], ['Final', f]].forEach(function (pair) {
      if (pair[1] !== '') {
        total++;
        call('encodeGrade', [authToken, sectionId, studentId, pair[0], pair[1]], function () {
          calls++;
          if (calls === total) { toast('Grade saved.'); loadClassListClick(); }
        });
      }
    });
  }

  // ============ STUDENT ============
  function renderEnrollSubjects() {
    var c = document.getElementById('content');
    c.innerHTML = '<h1>Enroll in Subjects</h1><div id="enroll-list">Loading…</div>';
    call('getEnrollableSubjects', [authToken], function (subjects) {
      if (!subjects.length) {
        document.getElementById('enroll-list').innerHTML = '<p class="muted">No subjects are available to enroll in right now.</p>';
        return;
      }
      var html = '';
      subjects.forEach(function (subj, i) {
        html += '<div class="card"><h3>' + esc(subj.subjectCode) + ' - ' + esc(subj.subjectName) +
          ' <span class="badge">' + esc(subj.units) + ' units</span></h3>';
        if (!subj.sections.length) {
          html += '<p class="muted">No open sections offered this term.</p>';
        } else {
          html += '<select id="enroll-sec-' + i + '">' + subj.sections.map(function (s) {
            return '<option value="' + esc(s.sectionId) + '">' + esc(s.sectionId) + ' — ' + esc(s.schedule) +
              ' — ' + esc(s.facultyName) + ' (' + esc(s.slotsLeft) + ' slots left)</option>';
          }).join('') + '</select>' +
          '<button ' + 'onclick="enrollFromDropdownClick(\'enroll-sec-' + i + '\')">Enroll</button>';
        }
        html += '</div>';
      });
      document.getElementById('enroll-list').innerHTML = html;
    });
  }
  function enrollFromDropdownClick(selId) {
    var sectionId = document.getElementById(selId).value;
    if (!sectionId) return;
    call('enrollStudent', [authToken, sectionId], function () {
      toast('Enrolled.'); renderEnrollSubjects();
    });
  }
  function renderMyEnrollment() {
    call('getMyEnrollment', [authToken], function (rows) {
      var html = '<h1>My Subjects</h1><div class="card"><table><tr><th>Subject</th><th>Units</th><th>Faculty</th><th>Schedule</th><th>Status</th></tr>';
      rows.forEach(function (r) {
        html += '<tr><td>' + esc(r.subjectCode) + ' - ' + esc(r.subjectName) + '</td><td>' + esc(r.units) +
          '</td><td>' + esc(r.facultyName) + '</td><td>' + esc(r.schedule) + '</td><td>' + badge(r.status) + '</td></tr>';
      });
      html += '</table></div>';
      document.getElementById('content').innerHTML = html;
    });
  }
  function renderMyGrades() {
    call('getGradesForStudent', [authToken, null], function (rows) {
      document.getElementById('content').innerHTML = '<h1>My Grades</h1><div class="card">' + renderGradeTable_(rows) + '</div>';
    });
  }
  function renderMyPayments() {
    call('getPaymentsForStudent', [authToken, null], function (rows) {
      var html = '<h1>My Payments</h1><div class="card"><table><tr><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr>';
      rows.forEach(function (r) {
        html += '<tr><td>' + esc(r.Amount) + '</td><td>' + esc(r.Method) + '</td><td>' + badge(r.Status) + '</td><td>' + esc(r.DateCreated) + '</td></tr>';
      });
      html += '</table><p class="muted">Online payment via PayMongo is coming soon.</p></div>';
      document.getElementById('content').innerHTML = html;
    });
  }

  function renderStudentDocuments() {
    var c = document.getElementById('content');
    c.innerHTML = '<h1>Request ToR / Diploma</h1>' +
      '<div class="card"><h3>New Request</h3><div class="form-grid">' +
      '<select id="doc-type"><option value="ToR">Transcript of Records (ToR)</option><option value="Diploma">Diploma</option></select>' +
      '<input id="doc-notes" placeholder="Notes (optional — e.g. purpose)"></div>' +
      '<button onclick="requestDocumentClick()">Submit Request</button></div>' +
      '<div class="card"><h3>My Requests</h3><div id="my-doc-requests">Loading…</div></div>';
    loadMyDocumentRequests_();
  }
  function requestDocumentClick() {
    call('requestDocument', [authToken, val('doc-type'), val('doc-notes')], function () {
      toast('Request submitted.'); renderStudentDocuments();
    });
  }
  function loadMyDocumentRequests_() {
    call('getMyDocumentRequests', [authToken], function (rows) {
      var html = '<table><tr><th>Type</th><th>Status</th><th>Requested</th><th>Released</th></tr>';
      rows.forEach(function (r) {
        html += '<tr><td>' + esc(r.Type) + '</td><td>' + badge(r.Status) + '</td><td>' +
          esc(r.DateRequested ? new Date(r.DateRequested).toLocaleDateString() : '') + '</td><td>' +
          esc(r.DateReleased ? new Date(r.DateReleased).toLocaleDateString() : '') + '</td></tr>';
      });
      html += '</table>';
      document.getElementById('my-doc-requests').innerHTML = html || '<p class="muted">No requests yet.</p>';
    });
  }

  function val(id) { return document.getElementById(id).value.trim(); }
</script>
</body>
</html>
